services:
  pdf-qa-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelligent-query-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app/src:/app
      - PYTHONUNBUFFERED=1
      - PORT=8080
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - pdf-qa-network
    # Uncomment for development with auto-reload
    # command: python -m flask run --host=0.0.0.0 --port=8080
    # Additional options for production
    # mem_limit: 2g
    # cpus: '1.5'

networks:
  pdf-qa-network:
    driver: bridge
